name: cache-rust
description: >-
  Point the Rust compiler at sccache backed by the GitHub Actions cache.

  sccache caches individual compilation units, so a warm build only recompiles
  what changed, across branches and runs. The storage is the Actions cache
  service (accelerated by Blacksmith on Blacksmith runners): per repository,
  nothing to host, no credentials, no tunnel.

  Until 2026-11-21 this pointed at a shared bucket in the cluster's MinIO,
  reached from outside through the cache-ci tunnel. MinIO was retired when its
  images stopped being published; the inputs are unchanged so no caller has to
  change.

  Call once before the build. sccache writes through as the compiler runs, so
  there is no separate save step.

inputs:
  version:
    description: sccache release to install when the runner does not already have it.
    required: false
    default: "0.19.0"
  required:
    description: >-
      Fail when sccache cannot start, instead of compiling cold. A cold build is
      slower, not broken, and nothing reports it, which is why this is on by
      default.
    required: false
    default: "true"
  key-prefix:
    description: >-
      Namespaces this job's entries within the repository's cache. The Actions
      cache is already per repository, so this only matters to separate jobs
      whose builds should not share objects.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Installs sccache and exports ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN,
    # which sccache's GHA backend needs and which a composite step cannot read
    # on its own.
    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v${{ inputs.version }}

    - name: Point rustc at sccache
      shell: bash
      env:
        REQUIRED: ${{ inputs.required }}
        KEY_PREFIX: ${{ inputs.key-prefix }}
      run: |
        set -euo pipefail
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GHA_ENABLED=true"
          # sccache and cargo incremental fight: incremental keeps per-crate
          # state that defeats an object cache.
          echo "CARGO_INCREMENTAL=0"
          if [[ -n "$KEY_PREFIX" ]]; then
            echo "SCCACHE_GHA_VERSION=${KEY_PREFIX}"
          fi
        } >> "$GITHUB_ENV"

        export SCCACHE_GHA_ENABLED=true
        [[ -n "$KEY_PREFIX" ]] && export SCCACHE_GHA_VERSION="$KEY_PREFIX"
        if sccache --start-server 2>/tmp/sccache-start.log; then
          echo "cache-rust: sccache serving from the GitHub Actions cache"
          sccache --show-stats 2>/dev/null | grep -iE "cache location" || true
        else
          cat /tmp/sccache-start.log || true
          if [[ "$REQUIRED" == "true" ]]; then
            echo "::error::cache-rust: sccache would not start. Set required: false to compile without it."
            exit 1
          fi
          echo "::warning::cache-rust: sccache would not start, compiling without a cache."
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
        fi
