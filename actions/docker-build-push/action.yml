name: Docker build and push
description: >-
  Build a Dockerfile and push it, on a builder whose disk survives between jobs.

  This exists because six repos in parses-gg carried near-identical copies of
  it, and the day the runners moved every one of them needed the same edit.

inputs:
  image:
    description: >-
      Image reference WITHOUT a tag, e.g. `peavers/parses-engine`. Do not put a
      registry host here - pass `registry` instead, from harbor-login's output,
      so the same call works on either kind of runner.
    required: true
  registry:
    description: >-
      Harbor host, from harbor-login's `registry` output. Optional now that ECR
      exists: leave it unset and `ecr: true` and the build goes to ECR alone,
      which is the end state. Set both only while a repo is mid-migration and
      wants the two registries kept in step.
    required: false
    default: ""
  tags:
    description: Newline- or comma-separated tags. Defaults to the commit SHA and `latest`.
    required: false
    default: ""
  context:
    description: Build context directory.
    required: false
    default: "."
  dockerfile:
    description: Dockerfile path. Defaults to <context>/Dockerfile.
    required: false
    default: ""
  cache-key:
    description: >-
      Sticky-disk identity. Two runs sharing it are what make the Dockerfile's
      RUN --mount=type=cache mounts persist. Defaults to the repository.
    required: false
    default: ""
  secrets:
    description: BuildKit secrets, `id=value` per line. Never build args - an arg is in the image history.
    required: false
    default: ""
  push:
    description: Push, or build only.
    required: false
    default: "true"
  ecr:
    description: >-
      Push to ECR (peavers-code/ecr). With `registry` unset this is the only
      destination; with both, the same build is tagged for each and pushed once,
      so they hold the same bytes by construction rather than by a later copy.
      Needs `id-token: write`, which callers already have for the Vault
      exchange.
    required: false
    default: "false"
  aws-region:
    description: Region for the ECR login.
    required: false
    default: us-east-1
  aws-role:
    description: Role to assume for the ECR push.
    required: false
    default: arn:aws:iam::665316247771:role/github-actions-ci

outputs:
  tags:
    description: The full tag list that was built.
    value: ${{ steps.plan.outputs.tags }}

runs:
  using: composite
  steps:
    # Before the tag plan, because the plan needs the registry host this prints.
    - uses: aws-actions/configure-aws-credentials@v5
      if: inputs.ecr == 'true'
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}
    - uses: aws-actions/amazon-ecr-login@v2
      id: ecr
      if: inputs.ecr == 'true'

    - name: Work out the tags
      id: plan
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE: ${{ inputs.image }}
        GIVEN: ${{ inputs.tags }}
        ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
      run: |
        set -euo pipefail
        if [ -z "${REGISTRY}" ] && [ -z "${ECR_REGISTRY:-}" ]; then
          echo "::error::nowhere to push. Set ecr: true, or pass harbor-login's registry output."
          exit 1
        fi
        # ECR alone is the normal case now. Everything below builds the Harbor
        # list first and mirrors it, so with no Harbor host the base list is
        # built against ECR instead and the mirror step has nothing to add.
        if [ -z "${REGISTRY}" ]; then
          REGISTRY="${ECR_REGISTRY}"
          ECR_REGISTRY=""
        fi
        case "${IMAGE}" in
          *.*/*|*:*)
            echo "::error::image should be a repository path like peavers/foo, with the host passed as registry."
            exit 1 ;;
        esac
        if [ -n "${GIVEN}" ]; then
          list="$(echo "${GIVEN}" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | sed "s#^#${REGISTRY}/${IMAGE}:#")"
        else
          list="${REGISTRY}/${IMAGE}:${GITHUB_SHA}
        ${REGISTRY}/${IMAGE}:latest"
        fi
        list="$(echo "${list}" | sed 's/^[[:space:]]*//')"
        # The same tags again under the ECR host. One build, two destinations:
        # Harbor and ECR end up holding the same digest because buildx pushed it
        # to both, not because something copied it afterwards and might not have.
        if [ -n "${ECR_REGISTRY:-}" ]; then
          mirrored="$(echo "${list}" | sed "s#^${REGISTRY}/#${ECR_REGISTRY}/#")"
          list="$(printf '%s\n%s' "${list}" "${mirrored}")"
        fi
        {
          echo "tags<<EOF"
          echo "${list}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "pushing:"; echo "${list}" | sed 's/^/  /'

    # Blacksmith's buildkitd runs on the runner host over a unix socket rather
    # than in a container created by dind, so the driver-opts: network=host the
    # hand-rolled copies carried is not unsupported - it is unnecessary.
    - uses: useblacksmith/setup-docker-builder@v2
      with:
        cache-key: ${{ inputs.cache-key != '' && inputs.cache-key || github.repository }}
        # Fail rather than fall back to a local builder. A fallback still
        # passes, silently uncached, which is how the sccache step this
        # replaced went unnoticed for months.
        nofallback: true

    # No registry buildcache on purpose: the sticky disk keeps that state
    # locally, so 314-575 MB no longer crosses the network on every build.
    - uses: useblacksmith/build-push-action@v2
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        # No attestation manifests: a second manifest per image for no consumer.
        provenance: false
        tags: ${{ steps.plan.outputs.tags }}
        secrets: ${{ inputs.secrets }}
