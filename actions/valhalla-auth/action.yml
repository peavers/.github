name: valhalla-auth
description: >-
  Fetch the home-lab credentials a job needs from Vault at runtime, and write
  them where the build tools look. Replaces the credentials the self-hosted
  runner pods used to mount into every job whether it asked for them or not.

  Ask for exactly what the job uses. Anything not requested is never read, so a
  workflow's `with:` block is an accurate statement of what it depends on -
  which is the point, and is what makes moving the job to an external runner a
  change of one line rather than an investigation.

# ── Why this exists ─────────────────────────────────────────────────────────
#
# `arc-runners` mounted four things into every runner pod: ~/.docker/config.json
# (Harbor), ~/.m2/settings.xml + NEXUS_PASSWORD (Nexus), MINIO_* (sccache) and
# ~/.kube/config. Workflows used them without declaring them, so nothing in any
# repo recorded that the dependency existed. Three consequences, all bad:
#
#   - a job could not run anywhere but in-cluster, and nothing said why
#   - the blast radius of the credentials was "every job in five orgs"
#   - reading a workflow told you nothing about what it could reach
#
# So each credential now arrives through the same OIDC exchange the GitHub App
# token already uses (see gh-app-token): the workflow presents its GitHub-signed
# JWT, Vault checks the repository_owner claim, and hands back only what the
# jwt-github/ci policy allows.
#
# ── The strict input, and why it defaults on ────────────────────────────────
#
# While the runner pods still mount the old credentials, a broken call here is
# invisible: the mounted file is still on disk and the build still passes. So by
# default this action DELETES the mounted copies before writing its own. A job
# that works with `strict: true` on a self-hosted runner is proven to work on a
# runner that never had them - which is the whole reason for doing this first.
#
# Set strict: false only to debug this action itself.

inputs:
  harbor:
    description: Log in to docker.valhalla.life, and export HARBOR_USERNAME / HARBOR_PASSWORD.
    required: false
    default: "false"
  maven:
    description: >-
      Write ~/.m2/settings.xml and export NEXUS_USERNAME / NEXUS_PASSWORD.
      Gradle picks the env vars up directly - parses-api's build.gradle already
      reads them via providers.environmentVariable.
    required: false
    default: "false"
  cargo:
    description: Export CARGO_REGISTRIES_VALHALLA_TOKEN for the `valhalla` sparse registry.
    required: false
    default: "false"
  npm:
    description: Write the @parses scope and its _auth line into ~/.npmrc.
    required: false
    default: "false"
  npm-scope:
    description: Scope to point at Nexus. The registry it resolves from is npm-group.
    required: false
    default: "@parses"
  npm-registry:
    description: >-
      Nexus npm repository the scope resolves from. Publishing needs npm-hosted;
      resolving needs npm-group, and a scope pointed at the group cannot publish.
    required: false
    default: https://packages.valhalla.life/repository/npm-group/
  secrets:
    description: >-
      Any other Vault secrets this job needs, in vault-action's own syntax. Here
      so that a workflow reading something valhalla-auth knows nothing about -
      an R2 key, a Cloudflare token - still gets the address resolution and the
      derived TLS verification, instead of spelling the cluster URL out and
      becoming unmovable. Values land in the environment for later steps.
    required: false
    default: ""
  strict:
    description: Delete the runner-mounted credentials first, proving the job does not use them.
    required: false
    default: "true"
  vault-url:
    description: >-
      Override the Vault address. Leave empty and the action probes: the
      in-cluster service if it answers, the tunnel hostname otherwise - which is
      what lets a job move to an external runner without editing anything here or
      in the calling workflow. TLS verification is derived from the answer, so it
      cannot be left off against a public certificate by accident.
    required: false
    default: ""

outputs:
  registry:
    description: >-
      Where to push images. `docker.valhalla.life` from inside the cluster, or a
      loopback address fronting the tunnel from outside. Tag and push with this
      rather than a literal, and the same workflow works on either runner.
      The repository path is what Harbor stores, so the cluster still pulls
      `docker.valhalla.life/...` either way.
    value: ${{ steps.harbor.outputs.registry }}

runs:
  using: composite
  steps:
    # Resolved ONCE here and passed down. The small actions each probe if they
    # are given nothing, and off-cluster that probe is a 5s timeout - three of
    # them would be 15s of dead time per job.
    - uses: peavers/.github/actions/vault-address@main
      id: vault
      with:
        vault-url: ${{ inputs.vault-url }}

    # Fail early and in the workflow's own words. vault-action's error for an
    # unreadable path is a 403 with a Vault path in it, which reads like a Vault
    # outage rather than "this action was called with nothing to do".
    - name: Check something was asked for
      shell: bash
      env:
        WANT: ${{ inputs.harbor }}${{ inputs.maven }}${{ inputs.cargo }}${{ inputs.npm }}
        EXTRA: ${{ inputs.secrets }}
      run: |
        set -euo pipefail
        [ -n "${EXTRA// /}" ] && exit 0
        case "$WANT" in
          *true*) ;;
          *) echo "::error::valhalla-auth was called with no credential requested. Pass at least one of harbor / maven / cargo / npm."
             exit 1 ;;
        esac

    # Remove what the runner pod mounted, so the steps below are the only source
    # of these credentials. See the header: without this the migration cannot be
    # verified while the mounts still exist.
    - name: Drop the runner-mounted credentials
      # Only when a credential type was actually asked for. A secrets-only call
      # has no business deleting an ~/.npmrc some earlier step wrote.
      if: >-
        inputs.strict == 'true' &&
        (inputs.harbor == 'true' || inputs.maven == 'true' ||
         inputs.cargo == 'true' || inputs.npm == 'true')
      shell: bash
      run: |
        set -euo pipefail
        rm -f "$HOME/.docker/config.json" "$HOME/.m2/settings.xml" "$HOME/.npmrc"
        # NEXUS_PASSWORD arrives via envFrom on the pod, so it is in this
        # process's environment and cannot be unset for later steps. Overwrite it
        # in GITHUB_ENV instead: the value below wins for every step that follows,
        # and is replaced with Vault's a moment later if maven or cargo was asked
        # for. If neither was, a job that quietly relied on it now fails.
        echo "NEXUS_PASSWORD=" >> "$GITHUB_ENV"
        echo "dropped mounted docker/maven/npm credentials"

    - uses: peavers/.github/actions/harbor-login@main
      id: harbor
      if: inputs.harbor == 'true'
      with:
        vault-url: ${{ steps.vault.outputs.url }}

    - uses: peavers/.github/actions/nexus-auth@main
      if: inputs.maven == 'true' || inputs.cargo == 'true' || inputs.npm == 'true'
      with:
        maven: ${{ inputs.maven }}
        cargo: ${{ inputs.cargo }}
        npm: ${{ inputs.npm }}
        npm-scope: ${{ inputs.npm-scope }}
        npm-registry: ${{ inputs.npm-registry }}
        vault-url: ${{ steps.vault.outputs.url }}

    - name: Other secrets from Vault
      if: inputs.secrets != ''
      uses: hashicorp/vault-action@v3
      with:
        url: ${{ steps.vault.outputs.url }}
        method: jwt
        path: jwt-github
        role: ci
        jwtGithubAudience: https://vault.internal
        tlsSkipVerify: ${{ steps.vault.outputs.tls-skip-verify }}
        exportToken: false
        secrets: ${{ inputs.secrets }}

    # Prove the credentials actually work, here, rather than three steps later
    # inside a build whose failure will be read as a build failure.
    - name: Verify
      shell: bash
      env:
        WANT_MAVEN: ${{ inputs.maven }}
        WANT_CARGO: ${{ inputs.cargo }}
        WANT_NPM: ${{ inputs.npm }}
      run: |
        set -euo pipefail
        fail=0
        if [ "$WANT_MAVEN" = true ] || [ "$WANT_CARGO" = true ]; then
          if [ -z "${NEXUS_PASSWORD:-}" ]; then
            echo "::error::Nexus password is empty after the Vault read."; fail=1
          fi
        fi
        if [ "$WANT_NPM" = true ] && [ -z "${NEXUS_NPM_AUTH:-}" ]; then
          echo "::error::Nexus npm auth is empty after the Vault read."; fail=1
        fi
        exit $fail
