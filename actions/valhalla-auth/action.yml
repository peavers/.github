name: valhalla-auth
description: >-
  Fetch the home-lab credentials a job needs from Vault at runtime, and write
  them where the build tools look. Replaces the credentials the self-hosted
  runner pods used to mount into every job whether it asked for them or not.

  Ask for exactly what the job uses. Anything not requested is never read, so a
  workflow's `with:` block is an accurate statement of what it depends on -
  which is the point, and is what makes moving the job to an external runner a
  change of one line rather than an investigation.

# ── Why this exists ─────────────────────────────────────────────────────────
#
# `arc-runners` mounted four things into every runner pod: ~/.docker/config.json
# (Harbor), ~/.m2/settings.xml + NEXUS_PASSWORD (Nexus), MINIO_* (sccache) and
# ~/.kube/config. Workflows used them without declaring them, so nothing in any
# repo recorded that the dependency existed. Three consequences, all bad:
#
#   - a job could not run anywhere but in-cluster, and nothing said why
#   - the blast radius of the credentials was "every job in five orgs"
#   - reading a workflow told you nothing about what it could reach
#
# So each credential now arrives through the same OIDC exchange the GitHub App
# token already uses (see gh-app-token): the workflow presents its GitHub-signed
# JWT, Vault checks the repository_owner claim, and hands back only what the
# jwt-github/ci policy allows.
#
# ── The strict input, and why it defaults on ────────────────────────────────
#
# While the runner pods still mount the old credentials, a broken call here is
# invisible: the mounted file is still on disk and the build still passes. So by
# default this action DELETES the mounted copies before writing its own. A job
# that works with `strict: true` on a self-hosted runner is proven to work on a
# runner that never had them - which is the whole reason for doing this first.
#
# Set strict: false only to debug this action itself.

inputs:
  harbor:
    description: Log in to docker.valhalla.life, and export HARBOR_USERNAME / HARBOR_PASSWORD.
    required: false
    default: "false"
  maven:
    description: >-
      Write ~/.m2/settings.xml and export NEXUS_USERNAME / NEXUS_PASSWORD.
      Gradle picks the env vars up directly - parses-api's build.gradle already
      reads them via providers.environmentVariable.
    required: false
    default: "false"
  cargo:
    description: Export CARGO_REGISTRIES_VALHALLA_TOKEN for the `valhalla` sparse registry.
    required: false
    default: "false"
  npm:
    description: Write the @parses scope and its _auth line into ~/.npmrc.
    required: false
    default: "false"
  npm-scope:
    description: Scope to point at Nexus. The registry it resolves from is npm-group.
    required: false
    default: "@parses"
  npm-registry:
    description: >-
      Nexus npm repository the scope resolves from. Publishing needs npm-hosted;
      resolving needs npm-group, and a scope pointed at the group cannot publish.
    required: false
    default: https://packages.valhalla.life/repository/npm-group/
  strict:
    description: Delete the runner-mounted credentials first, proving the job does not use them.
    required: false
    default: "true"
  vault-url:
    description: >-
      Override the Vault address. Leave empty and the action probes: the
      in-cluster service if it answers, the tunnel hostname otherwise - which is
      what lets a job move to an external runner without editing anything here or
      in the calling workflow. TLS verification is derived from the answer, so it
      cannot be left off against a public certificate by accident.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Where Vault is, decided at run time rather than per workflow.
    #
    # The in-cluster address only resolves inside the cluster, and the tunnel
    # hostname works from anywhere - so probing which one answers is what lets a
    # repo move to an external runner by setting a variable, with no edit here or
    # in the calling workflow.
    #
    # tlsSkipVerify is DERIVED from the answer, and that is the point. Vault
    # serves a private CA in-cluster and a publicly trusted certificate through
    # the tunnel, so "skip verification" is exactly "we are talking to the
    # cluster service". Tying them together removes the failure where someone
    # repoints the URL and leaves verification off against a public endpoint,
    # which nothing would report.
    - name: Resolve the Vault address
      id: vault
      shell: bash
      env:
        EXPLICIT: ${{ inputs.vault-url }}
        IN_CLUSTER: https://vault.vault.svc.cluster.local:8200
        VIA_TUNNEL: https://vault-ci.parses.gg
      run: |
        set -euo pipefail
        if [ -n "${EXPLICIT}" ]; then
          url="${EXPLICIT}"
          echo "vault: using the address this workflow asked for"
        elif curl -fsk --max-time 5 "${IN_CLUSTER}/v1/sys/health?standbyok=true" >/dev/null 2>&1; then
          url="${IN_CLUSTER}"
          echo "vault: in-cluster service answered - using it"
        else
          url="${VIA_TUNNEL}"
          echo "vault: no route to the cluster service - using the tunnel"
        fi
        case "$url" in
          *.svc.cluster.local*) skip=true  ;;   # private CA, only valid inside
          *)                    skip=false ;;   # public certificate, verify it
        esac
        echo "url=$url"   >> "$GITHUB_OUTPUT"
        echo "skip=$skip" >> "$GITHUB_OUTPUT"
        echo "vault: $url (tlsSkipVerify=$skip)"

    # Fail early and in the workflow's own words. vault-action's error for an
    # unreadable path is a 403 with a Vault path in it, which reads like a Vault
    # outage rather than "this action was called with nothing to do".
    - name: Check something was asked for
      shell: bash
      env:
        WANT: ${{ inputs.harbor }}${{ inputs.maven }}${{ inputs.cargo }}${{ inputs.npm }}
      run: |
        set -euo pipefail
        case "$WANT" in
          *true*) ;;
          *) echo "::error::valhalla-auth was called with no credential requested. Pass at least one of harbor / maven / cargo / npm."
             exit 1 ;;
        esac

    # Remove what the runner pod mounted, so the steps below are the only source
    # of these credentials. See the header: without this the migration cannot be
    # verified while the mounts still exist.
    - name: Drop the runner-mounted credentials
      if: inputs.strict == 'true'
      shell: bash
      run: |
        set -euo pipefail
        rm -f "$HOME/.docker/config.json" "$HOME/.m2/settings.xml" "$HOME/.npmrc"
        # NEXUS_PASSWORD arrives via envFrom on the pod, so it is in this
        # process's environment and cannot be unset for later steps. Overwrite it
        # in GITHUB_ENV instead: the value below wins for every step that follows,
        # and is replaced with Vault's a moment later if maven or cargo was asked
        # for. If neither was, a job that quietly relied on it now fails.
        echo "NEXUS_PASSWORD=" >> "$GITHUB_ENV"
        echo "dropped mounted docker/maven/npm credentials"

    - name: Harbor credentials from Vault
      id: harbor
      if: inputs.harbor == 'true'
      uses: hashicorp/vault-action@v3
      with:
        url: ${{ steps.vault.outputs.url }}
        method: jwt
        path: jwt-github
        role: ci
        jwtGithubAudience: https://vault.internal
        tlsSkipVerify: ${{ steps.vault.outputs.skip }}
        exportToken: false
        secrets: |
          kv/data/cluster/_shared/harbor username | HARBOR_USERNAME ;
          kv/data/cluster/_shared/harbor password | HARBOR_PASSWORD

    - name: Log in to Harbor
      if: inputs.harbor == 'true'
      uses: docker/login-action@v3
      with:
        registry: docker.valhalla.life
        # vault-action names its outputs after the env var each secret maps to,
        # LOWERCASED. Used here rather than the env context because a composite
        # action's `with:` is evaluated before the previous step's GITHUB_ENV is
        # visible to it, and the failure is an empty username, not an error.
        username: ${{ steps.harbor.outputs.harbor_username }}
        password: ${{ steps.harbor.outputs.harbor_password }}

    # One Vault read serves both maven and cargo: they are the same Nexus user,
    # and cargo's token is only that credential base64'd.
    - name: Nexus credentials from Vault
      if: inputs.maven == 'true' || inputs.cargo == 'true'
      uses: hashicorp/vault-action@v3
      with:
        url: ${{ steps.vault.outputs.url }}
        method: jwt
        path: jwt-github
        role: ci
        jwtGithubAudience: https://vault.internal
        tlsSkipVerify: ${{ steps.vault.outputs.skip }}
        exportToken: false
        secrets: |
          kv/data/cluster/_shared/nexus-runners username | NEXUS_USERNAME ;
          kv/data/cluster/_shared/nexus-runners password | NEXUS_PASSWORD

    - name: Write ~/.m2/settings.xml
      if: inputs.maven == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Identical to the settings.xml the runner pods mounted, and it holds no
        # secret: the password is a ${env.NEXUS_PASSWORD} reference that Maven
        # resolves at run time. Only the environment variable is sensitive.
        mkdir -p "$HOME/.m2"
        cat > "$HOME/.m2/settings.xml" <<'XML'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <mirrors>
            <mirror>
              <id>nexus-public</id>
              <url>https://packages.valhalla.life/repository/maven-public/</url>
              <mirrorOf>*</mirrorOf>
            </mirror>
          </mirrors>
          <servers>
            <server>
              <id>nexus-public</id>
              <username>${env.NEXUS_USERNAME}</username>
              <password>${env.NEXUS_PASSWORD}</password>
            </server>
            <server>
              <id>nexus-releases</id>
              <username>${env.NEXUS_USERNAME}</username>
              <password>${env.NEXUS_PASSWORD}</password>
            </server>
            <server>
              <id>nexus-snapshots</id>
              <username>${env.NEXUS_USERNAME}</username>
              <password>${env.NEXUS_PASSWORD}</password>
            </server>
          </servers>
        </settings>
        XML
        echo "wrote ~/.m2/settings.xml for user ${NEXUS_USERNAME}"

    - name: Export the cargo registry token
      if: inputs.cargo == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # cargo wants HTTP Basic. Masked before it is written so a later step
        # dumping the environment cannot leak it.
        TOKEN="$(printf '%s:%s' "${NEXUS_USERNAME}" "${NEXUS_PASSWORD}" | base64 -w0)"
        echo "::add-mask::${TOKEN}"
        echo "CARGO_REGISTRIES_VALHALLA_TOKEN=Basic ${TOKEN}" >> "$GITHUB_ENV"
        echo "cargo registry 'valhalla' authenticated as ${NEXUS_USERNAME}"

    - name: Nexus npm auth from Vault
      if: inputs.npm == 'true'
      uses: hashicorp/vault-action@v3
      with:
        url: ${{ steps.vault.outputs.url }}
        method: jwt
        path: jwt-github
        role: ci
        jwtGithubAudience: https://vault.internal
        tlsSkipVerify: ${{ steps.vault.outputs.skip }}
        exportToken: false
        secrets: |
          kv/data/cluster/_shared/nexus-npm auth | NEXUS_NPM_AUTH

    - name: Write ~/.npmrc
      if: inputs.npm == 'true'
      shell: bash
      env:
        SCOPE: ${{ inputs.npm-scope }}
        REGISTRY: ${{ inputs.npm-registry }}
      run: |
        set -euo pipefail
        # The _auth line is keyed on the registry path, so it has to match the
        # scope's registry exactly - a scope pointed at npm-hosted with an _auth
        # for npm-group authenticates nothing, and npm reports it as a 401 on
        # publish rather than as a configuration error.
        path="${REGISTRY#https:}"
        {
          printf '%s:registry=%s\n' "${SCOPE}" "${REGISTRY}"
          printf '%s:_auth=%s\n' "${path}" "${NEXUS_NPM_AUTH}"
          printf 'always-auth=true\n'
        } >> "$HOME/.npmrc"
        echo "wrote ~/.npmrc for ${SCOPE} -> ${REGISTRY}"

    # Prove the credentials actually work, here, rather than three steps later
    # inside a build whose failure will be read as a build failure.
    - name: Verify
      shell: bash
      env:
        WANT_MAVEN: ${{ inputs.maven }}
        WANT_CARGO: ${{ inputs.cargo }}
        WANT_NPM: ${{ inputs.npm }}
      run: |
        set -euo pipefail
        fail=0
        if [ "$WANT_MAVEN" = true ] || [ "$WANT_CARGO" = true ]; then
          if [ -z "${NEXUS_PASSWORD:-}" ]; then
            echo "::error::Nexus password is empty after the Vault read."; fail=1
          fi
        fi
        if [ "$WANT_NPM" = true ] && [ -z "${NEXUS_NPM_AUTH:-}" ]; then
          echo "::error::Nexus npm auth is empty after the Vault read."; fail=1
        fi
        exit $fail
