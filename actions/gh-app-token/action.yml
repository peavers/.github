name: gh-app-token
description: >-
  Mint a short-lived GitHub App installation token via Vault OIDC. Drop-in
  replacement for "push as us" PATs — no long-lived secret is stored in GitHub.

  Finds Vault at run time: the in-cluster service if it answers, the tunnel
  hostname otherwise. So this no longer pins a job to the in-cluster runners, and
  a caller needs no configuration either way.

inputs:
  owner:
    description: Org/owner to scope the token to. Defaults to the calling repo's owner.
    required: false
    default: ${{ github.repository_owner }}
  vault-url:
    description: >-
      Override the Vault address. Leave empty and the action probes: the
      in-cluster service if it answers, the tunnel hostname otherwise - which is
      what lets a job move to an external runner without editing anything here or
      in the calling workflow. TLS verification is derived from the answer, so it
      cannot be left off against a public certificate by accident.
    required: false
    default: ""

outputs:
  token:
    description: Short-lived (~1h) GitHub App installation token.
    value: ${{ steps.app-token.outputs.token }}
  app-slug:
    description: The App's slug (e.g. for the "<slug>[bot]" commit identity).
    value: ${{ steps.app-token.outputs.app-slug }}
  installation-id:
    description: The resolved installation id (handy for debugging).
    value: ${{ steps.app-token.outputs.installation-id }}

runs:
  using: composite
  steps:
    # Where Vault is, decided at run time rather than per workflow.
    #
    # The in-cluster address only resolves inside the cluster, and the tunnel
    # hostname works from anywhere - so probing which one answers is what lets a
    # repo move to an external runner by setting a variable, with no edit here or
    # in the calling workflow.
    #
    # tlsSkipVerify is DERIVED from the answer, and that is the point. Vault
    # serves a private CA in-cluster and a publicly trusted certificate through
    # the tunnel, so "skip verification" is exactly "we are talking to the
    # cluster service". Tying them together removes the failure where someone
    # repoints the URL and leaves verification off against a public endpoint,
    # which nothing would report.
    - name: Resolve the Vault address
      id: vault
      shell: bash
      env:
        EXPLICIT: ${{ inputs.vault-url }}
        IN_CLUSTER: https://vault.vault.svc.cluster.local:8200
        VIA_TUNNEL: https://vault-ci.valhalla.life
      run: |
        set -euo pipefail
        if [ -n "${EXPLICIT}" ]; then
          url="${EXPLICIT}"
          echo "vault: using the address this workflow asked for"
        elif curl -fsk --max-time 5 "${IN_CLUSTER}/v1/sys/health?standbyok=true" >/dev/null 2>&1; then
          url="${IN_CLUSTER}"
          echo "vault: in-cluster service answered - using it"
        else
          url="${VIA_TUNNEL}"
          echo "vault: no route to the cluster service - using the tunnel"
        fi
        case "$url" in
          *.svc.cluster.local*) skip=true  ;;   # private CA, only valid inside
          *)                    skip=false ;;   # public certificate, verify it
        esac
        echo "url=$url"   >> "$GITHUB_OUTPUT"
        echo "skip=$skip" >> "$GITHUB_OUTPUT"
        echo "vault: $url (tlsSkipVerify=$skip)"

    # 1. Exchange this job's GitHub OIDC JWT for the App key, straight from Vault.
    #    Trust is org-wildcarded on the repository_owner claim (Vault role jwt-github/ci),
    #    so any repo in an allowed org works with zero per-repo config.
    - name: Fetch GitHub App key from Vault (GitHub OIDC -> jwt-github/ci)
      uses: hashicorp/vault-action@v3
      with:
        url: ${{ steps.vault.outputs.url }}
        method: jwt
        path: jwt-github
        role: ci
        jwtGithubAudience: https://vault.internal          # must match the role's bound_audiences
        tlsSkipVerify: ${{ steps.vault.outputs.skip }}
        exportToken: false
        secrets: |
          kv/data/cluster/_shared/ci-github-app app_id | GH_APP_ID ;
          kv/data/cluster/_shared/ci-github-app private_key | GH_APP_KEY

    # 2. Mint the 1h installation token from the App key. Inherits the App's
    #    permissions; auto-expires; scoped to `owner`; nothing to revoke.
    - name: Mint installation token
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ env.GH_APP_ID }}
        private-key: ${{ env.GH_APP_KEY }}
        owner: ${{ inputs.owner }}
