# Build and test a Gradle project (the Spring services): ./gradlew build, so a
# repo's own workflow stays a few lines.
#
#   permissions:
#     contents: read
#     id-token: write        # Vault OIDC, for the Nexus maven repositories
#   jobs:
#     gradle:
#       uses: peavers/.github/.github/workflows/gradle.yml@v1
#       with:
#         working-directory: server
#
# With postgres: true a Postgres 16 service runs, and both DATABASE_URL and
# the SPRING_DATASOURCE_* variables point at it.
name: Gradle

on:
  workflow_call:
    inputs:
      working-directory:
        description: Where gradlew is.
        type: string
        default: "."
      tasks:
        type: string
        default: "build"
      java-version:
        type: string
        default: "25"
      java-distribution:
        type: string
        default: temurin
      postgres:
        type: boolean
        default: false
      nexus:
        description: Authenticate to the valhalla Nexus maven repositories.
        type: boolean
        default: true
      extra:
        description: A shell command run after the tasks, in working-directory.
        type: string
        default: ""
      runner:
        description: Runner label. Default is the repo's RUNNER_LABEL, else Blacksmith.
        type: string
        default: ""

jobs:
  gradle:
    name: Gradle
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'blacksmith-4vcpu-ubuntu-2404' }}
    services:
      postgres:
        # An empty image skips the service.
        image: ${{ inputs.postgres && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ inputs.postgres && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
      SPRING_DATASOURCE_URL: ${{ inputs.postgres && 'jdbc:postgresql://localhost:5432/postgres' || '' }}
      SPRING_DATASOURCE_USERNAME: ${{ inputs.postgres && 'postgres' || '' }}
      SPRING_DATASOURCE_PASSWORD: ${{ inputs.postgres && 'postgres' || '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      - uses: gradle/actions/setup-gradle@v4

      - if: inputs.nexus
        uses: peavers/.github/actions/valhalla-auth@v1
        with:
          maven: "true"

      - name: Gradle
        run: ./gradlew ${{ inputs.tasks }} --no-daemon

      - name: Extra
        if: inputs.extra != ''
        run: ${{ inputs.extra }}
