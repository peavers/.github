name: tauri-publish

# Reusable publish stage for every Peavers Tauri desktop app. Callers build on
# GitHub-hosted runners (the only place macOS/Windows builds can run — the
# in-cluster pool is Linux) and hand the bundles off via actions/upload-artifact.
# This workflow then does everything that touches the public release repo, on
# the in-cluster runners, because the GitHub App token, the Azure signing
# credentials and (optionally) the Tauri updater key all come from Vault
# (internal-only) and must never live on a build runner.
#
# Order is load-bearing:
#   1. Authenticode-sign the Windows installer (changes its bytes).
#   2. Re-sign every updater artifact with the real Tauri key, so each .sig
#      covers the final bytes. Builds use a throwaway updater key (or, for
#      apps that sign at build time, a key that predates Authenticode), so this
#      step is what makes auto-update actually verify.
#   3. Create the release as a draft and upload the assets.
#   4. Write latest.json into the draft, from the bundles on disk.
#   5. Publish. This is the only step that makes any of it visible, and it is
#      last because `releases/latest/download/latest.json` — the endpoint every
#      installed client polls — starts resolving here. Writing the manifest
#      after this point leaves that URL 404ing in between, which clients report
#      as "Could not fetch a valid release JSON from the remote".
# Missing Azure creds -> the sign step no-ops and the release ships unsigned;
# missing updater key -> .sig files are left as-is.

on:
  workflow_call:
    inputs:
      product-name:
        description: Human name for the release title, e.g. "UI Vault".
        type: string
        required: true
      public-owner:
        description: Owner of the public release repo, e.g. peavers-warcraft.
        type: string
        required: true
      public-name:
        description: Name of the public release repo, e.g. PeaversUIVault.
        type: string
        required: true
      version:
        description: Release version without the leading v, e.g. 3.1.2.
        type: string
        required: true
      windows-installer-glob:
        description: Space-separated globs of Windows installers to Authenticode-sign.
        type: string
        default: dist/*.msi dist/*-setup.exe
      updater-key-vault-path:
        description: >-
          KV v2 path (after kv/data/) holding the Tauri updater private key in
          field tauri_signing_private_key, e.g. cluster/parses/updater. Leave
          empty to instead use the TAURI_SIGNING_PRIVATE_KEY secret.
        type: string
        default: ""
      stable-installer-name:
        description: >-
          If set, the signed Windows installer is also uploaded under this exact
          name, giving a permanent releases/latest/download/<name> link.
        type: string
        default: ""
      runner:
        description: >-
          The in-cluster runner pool to publish from. Self-hosted runners are
          scoped to the org that registered them, so a caller outside
          peavers-code cannot claim the default and MUST pass its own pool —
          parses-gg/parses-desktop passes parses-gg-runners.

          Getting this wrong does not fail the job, which is the whole reason it
          is an input: an unclaimable label leaves the run queued at "Waiting for
          a runner to pick up this job..." until it times out hours later, having
          published nothing and reported no error. Any pool works provided it can
          reach Vault at vault.vault.svc.cluster.local, which every in-cluster
          pool can and no GitHub-hosted runner can.
        type: string
        default: peavers-code-runners
    secrets:
      # Used only when updater-key-vault-path is empty (apps that keep the key
      # as a GitHub secret rather than in Vault).
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

jobs:
  publish:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write # Vault OIDC
    steps:
      - name: Mint GitHub App token (Vault OIDC)
        id: ghtoken
        uses: peavers/.github/actions/gh-app-token@main
        with:
          owner: ${{ inputs.public-owner }}

      - name: Fetch Azure signing credentials
        continue-on-error: true
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.vault.svc.cluster.local:8200
          method: jwt
          path: jwt-github
          role: ci
          jwtGithubAudience: https://vault.internal
          tlsSkipVerify: true
          exportToken: false
          secrets: |
            kv/data/cluster/_shared/azure-artifact-signing tenant_id | AZURE_TENANT_ID ;
            kv/data/cluster/_shared/azure-artifact-signing client_id | AZURE_CLIENT_ID ;
            kv/data/cluster/_shared/azure-artifact-signing client_secret | AZURE_CLIENT_SECRET

      # The Tauri updater key comes from one of two places. Both export it to
      # $GITHUB_ENV as TAURI_SIGNING_PRIVATE_KEY for the re-sign step.
      - name: Fetch updater key from Vault
        if: inputs.updater-key-vault-path != ''
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.vault.svc.cluster.local:8200
          method: jwt
          path: jwt-github
          role: ci
          jwtGithubAudience: https://vault.internal
          tlsSkipVerify: true
          exportToken: false
          secrets: |
            kv/data/${{ inputs.updater-key-vault-path }} tauri_signing_private_key | TAURI_SIGNING_PRIVATE_KEY

      - name: Load updater key from secret
        if: inputs.updater-key-vault-path == ''
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # secrets can't be referenced in an `if:`, so guard on the value here.
          if [ -n "$KEY" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<__EOF__"
              echo "$KEY"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la dist || true

      # No-ops when the Azure credentials are absent (ships unsigned).
      - name: Authenticode sign the Windows installer
        id: authenticode
        uses: peavers/.github/actions/azure-authenticode-sign@main
        with:
          files: ${{ inputs.windows-installer-glob }}
          account: peavers-parses
          profile: parses

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate updater signatures over the final bytes
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "No updater key available — leaving .sig files as built."
            exit 0
          fi
          # Sign the updater artifacts with the real key over the shipped bytes.
          # Two sources, unioned and de-duped:
          #   (a) the Windows installer(s) — always updater artifacts, and the
          #       Authenticode step just changed their bytes. Some apps collect
          #       only the installer (no build-time .sig), so this also CREATES
          #       the .sig rather than only refreshing it.
          #   (b) anything the build already produced a sibling .sig for
          #       (macOS .app.tar.gz/.dmg, etc), signed with a throwaway key.
          shopt -s nullglob
          declare -A targets
          # Canonical updater artifacts, signed even when the build collected
          # no .sig (some apps ship only the bundle): Windows installers plus
          # the macOS/Linux updater tarballs.
          for f in ${{ inputs.windows-installer-glob }} dist/*.app.tar.gz dist/*.AppImage.tar.gz; do
            [ -f "$f" ] && targets["$f"]=1
          done
          # Anything the build already produced a sibling .sig for (e.g. a
          # .dmg an app signs directly), refreshed over the shipped bytes.
          for f in dist/*; do
            [ -f "$f" ] || continue
            case "$f" in *.sig) continue;; esac
            [ -e "$f.sig" ] && targets["$f"]=1
          done
          for f in "${!targets[@]}"; do
            echo "re-signing $f"
            npx --yes @tauri-apps/cli@^2 signer sign "$f"
          done

      - name: Stable-named installer copy
        if: inputs.stable-installer-name != ''
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in ${{ inputs.windows-installer-glob }}; do
            cp "$f" "dist/${{ inputs.stable-installer-name }}"
            break
          done

      - name: Create release in public repo
        id: create
        uses: actions/github-script@v7
        env:
          PRODUCT: ${{ inputs.product-name }}
          VERSION: ${{ inputs.version }}
          PUBLIC_OWNER: ${{ inputs.public-owner }}
          PUBLIC_NAME: ${{ inputs.public-name }}
        with:
          github-token: ${{ steps.ghtoken.outputs.token }}
          script: |
            const { PRODUCT, VERSION, PUBLIC_OWNER, PUBLIC_NAME } = process.env;
            const tag = `v${VERSION}`;
            const existing = await github.rest.repos.getReleaseByTag({
              owner: PUBLIC_OWNER, repo: PUBLIC_NAME, tag,
            }).catch(() => null);
            if (existing) {
              console.log('Release already exists, reusing it');
              core.setOutput('release_id', existing.data.id);
              return;
            }
            const body = [
              `## ${PRODUCT} v${VERSION}`,
              '',
              'Bug fixes and improvements. If you already have the app installed,',
              'it will offer this update automatically.',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: PUBLIC_OWNER, repo: PUBLIC_NAME,
              tag_name: tag, name: `${PRODUCT} v${VERSION}`,
              body, draft: true, prerelease: false,
            });
            console.log('Created release', data.id);
            core.setOutput('release_id', data.id);

      - name: Upload assets to the release
        uses: actions/github-script@v7
        env:
          PUBLIC_OWNER: ${{ inputs.public-owner }}
          PUBLIC_NAME: ${{ inputs.public-name }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        with:
          github-token: ${{ steps.ghtoken.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { PUBLIC_OWNER, PUBLIC_NAME, RELEASE_ID } = process.env;
            const dir = 'dist';
            const files = fs.readdirSync(dir).filter(f => fs.statSync(path.join(dir, f)).isFile());
            if (files.length === 0) throw new Error('No artifacts in dist/ to upload!');
            for (const name of files) {
              const data = fs.readFileSync(path.join(dir, name));
              console.log(`Uploading ${name} (${data.length} bytes)...`);
              try {
                await github.rest.repos.uploadReleaseAsset({
                  owner: PUBLIC_OWNER, repo: PUBLIC_NAME, release_id: parseInt(RELEASE_ID),
                  name, data,
                  headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
                });
                console.log(`  uploaded ${name}`);
              } catch (error) {
                if (error.status === 422 && String(error.message).includes('already_exists')) {
                  console.log(`  ${name} already exists, skipping`);
                } else { throw error; }
              }
            }

      # Written while the release is still a draft, and deliberately so.
      #
      # `releases/latest/download/latest.json` is the endpoint compiled into
      # every installed client. GitHub points `latest` at a release the moment
      # it stops being a draft, so publishing first and writing the manifest
      # after leaves a window in which that URL 404s — and a 404 from its only
      # endpoint is what tauri-plugin-updater reports as "Could not fetch a
      # valid release JSON from the remote". Measured at 13 seconds on Parses
      # v0.1.30, which is 13 seconds in which every client on earth that checks
      # is told updates are broken.
      #
      # A draft is invisible to `latest`, so with this order clients keep
      # reading the previous release's manifest until the new one is complete,
      # and the switch is a single atomic step. It also means a run that dies
      # partway leaves the last good release standing rather than a public one
      # with no manifest.
      - name: Generate latest.json and add it to the draft
        uses: actions/github-script@v7
        env:
          PRODUCT: ${{ inputs.product-name }}
          VERSION: ${{ inputs.version }}
          PUBLIC_OWNER: ${{ inputs.public-owner }}
          PUBLIC_NAME: ${{ inputs.public-name }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        with:
          github-token: ${{ steps.ghtoken.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { PRODUCT, VERSION, PUBLIC_OWNER, PUBLIC_NAME, RELEASE_ID } = process.env;

            // Read the bundles off the runner rather than back out of the API.
            // dist/ is exactly what the upload step just sent, it needs no
            // wait for the API to become consistent, and — the reason this
            // step can run before publishing at all — a draft release's assets
            // are not downloadable over the public URL. The signatures are
            // sitting right here next to the files they cover.
            const dir = 'dist';
            const names = fs.readdirSync(dir).filter(f => fs.statSync(path.join(dir, f)).isFile());
            console.log('Bundles:', names.join(', '));

            const latest = { version: VERSION, notes: `${PRODUCT} v${VERSION}`, pub_date: new Date().toISOString(), platforms: {} };

            // Map a filename to Tauri updater platform keys. macOS with no arch
            // marker is a universal bundle → both darwin keys.
            const platformsFor = (n) => {
              if (n.endsWith('.dmg') || n.endsWith('.app.tar.gz')) {
                if (n.includes('aarch64') || n.includes('arm64')) return ['darwin-aarch64'];
                if (n.includes('x64') || n.includes('x86_64') || n.includes('intel')) return ['darwin-x86_64'];
                return ['darwin-aarch64', 'darwin-x86_64'];
              }
              if (n.endsWith('.deb') || n.endsWith('.appimage') || n.endsWith('.appimage.tar.gz')) return ['linux-x86_64'];
              if (n.endsWith('.msi') || n.endsWith('-setup.exe')) return ['windows-x86_64'];
              return [];
            };
            // Prefer the true updater artifact when several map to one platform:
            // .app.tar.gz over .dmg for macOS; the versioned installer over any
            // stable-named copy. Lower rank wins (processed first).
            const rank = (n) => n.endsWith('.app.tar.gz') ? 0
              : (n.endsWith('.msi') || n.endsWith('-setup.exe')) ? 1
              : (n.endsWith('.appimage') || n.endsWith('.appimage.tar.gz')) ? 2
              : n.endsWith('.deb') ? 3 : n.endsWith('.dmg') ? 4 : 9;

            const bundles = names
              .filter(n => !n.toLowerCase().endsWith('.sig') && n !== 'latest.json')
              .sort((a, b) => rank(a.toLowerCase()) - rank(b.toLowerCase()));

            for (const name of bundles) {
              const n = name.toLowerCase();
              const platforms = platformsFor(n);
              if (platforms.length === 0) { console.log(`  no platform for ${name}`); continue; }

              // Spelled out rather than read from the asset's
              // browser_download_url, which for a draft can carry an
              // `untagged-...` placeholder instead of the tag. This is the URL
              // the asset answers on once the release below goes public.
              const cfg = {
                url: `https://github.com/${PUBLIC_OWNER}/${PUBLIC_NAME}/releases/download/v${VERSION}/${encodeURIComponent(name)}`,
              };
              const sig = path.join(dir, name + '.sig');
              if (fs.existsSync(sig)) cfg.signature = fs.readFileSync(sig, 'utf8').trim();
              else console.log(`  no sig alongside ${name}`);

              for (const p of platforms) {
                if (!latest.platforms[p]) {
                  latest.platforms[p] = cfg;
                  console.log(`  ${name} -> ${p}${cfg.signature ? ' (signed)' : ''}`);
                }
              }
            }

            if (Object.keys(latest.platforms).length === 0) {
              throw new Error('latest.json has no platforms — updates would break');
            }
            const content = JSON.stringify(latest, null, 2);
            console.log(content);
            // The reuse path (a re-run against an existing release) can find
            // one already there. Safe to delete now only because the release
            // is still a draft; doing it after publishing is what left a
            // public release momentarily without a manifest.
            const release = await github.rest.repos.getRelease({
              owner: PUBLIC_OWNER, repo: PUBLIC_NAME, release_id: parseInt(RELEASE_ID),
            });
            const existing = release.data.assets.find(a => a.name === 'latest.json');
            if (existing) await github.rest.repos.deleteReleaseAsset({ owner: PUBLIC_OWNER, repo: PUBLIC_NAME, asset_id: existing.id });
            await github.rest.repos.uploadReleaseAsset({
              owner: PUBLIC_OWNER, repo: PUBLIC_NAME, release_id: parseInt(RELEASE_ID),
              name: 'latest.json', data: Buffer.from(content),
              headers: { 'content-type': 'application/json', 'content-length': content.length },
            });
            console.log('Uploaded latest.json');

      # Last, and last for a reason: this is the single step that makes the new
      # version visible to every installed client, and by here the release is
      # complete.
      - name: Publish release
        uses: actions/github-script@v7
        env:
          PUBLIC_OWNER: ${{ inputs.public-owner }}
          PUBLIC_NAME: ${{ inputs.public-name }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        with:
          github-token: ${{ steps.ghtoken.outputs.token }}
          script: |
            const { PUBLIC_OWNER, PUBLIC_NAME, RELEASE_ID } = process.env;
            await github.rest.repos.updateRelease({
              owner: PUBLIC_OWNER, repo: PUBLIC_NAME, release_id: parseInt(RELEASE_ID),
              draft: false, prerelease: false,
            });
            console.log('Published release');
