name: Dockerfile Buildx Publish (reusable)

# Build a Dockerfile-based image (e.g. a React/nginx frontend) with Buildx and
# push it to Harbor. Harbor creds come from in-cluster Vault (no stored secrets),
# so this MUST run on the self-hosted in-cluster runners.
#
# Example caller:
#   permissions: { id-token: write, contents: read }
#   jobs:
#     web:
#       uses: peavers/.github/.github/workflows/dockerfile-buildx-publish.yml@main
#       with:
#         context: resonance-web
#         image: docker.valhalla.life/peavers/resonance-web
#         runner: peavers-code-runners

on:
  workflow_call:
    inputs:
      context:
        description: Build context directory.
        required: true
        type: string
      image:
        description: Full image reference to push (registry/repo, no tag).
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: linux/amd64
      file:
        description: Dockerfile path. Defaults to <context>/Dockerfile.
        required: false
        type: string
        default: ""
      runner:
        description: >-
          Runner label. Defaults to ubuntu-latest, which any org can claim; set
          RUNNER_LABEL on the calling repo to move it to Blacksmith. Naming a
          pool that does not exist does not fail - it leaves the run queued at
          "Waiting for a runner" until it times out hours later.
        required: false
        type: string
        default: ubuntu-latest
      ecr:
        description: >-
          Also publish to ECR, which is where the cluster is moving
          (peavers-code/ecr). Copied after the push rather than pushed twice,
          because these builders take a single destination; crane moves the
          manifest unaltered, so the digests match and the step fails if they
          do not. Needs id-token: write, which the Vault exchange already has.
        required: false
        type: boolean
        default: false
      registry:
        description: Container registry host (for docker login).
        required: false
        type: string
        default: docker.valhalla.life
    outputs:
      version:
        description: Immutable version pushed (semver from tag, else 7-char SHA).
        value: ${{ jobs.build.outputs.version }}
      tags:
        description: Comma-separated tag list "latest,<version>".
        value: ${{ jobs.build.outputs.tags }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # RUNNER_LABEL is read from the CALLING repository - GitHub resolves the vars
    # context of a reusable workflow against the caller, not against this repo -
    # so one variable per repo moves that repo's jobs off the cluster without a
    # commit anywhere. Unset falls through to `runner`, which is today's
    # behaviour. A caller with a job that must stay in-cluster pins a literal in
    # its own workflow rather than setting the variable.
    runs-on: ${{ vars.RUNNER_LABEL || inputs.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Harbor credentials and the route to Harbor. In-cluster that is the
      # registry directly; anywhere else this opens the CI tunnel.
      - uses: peavers/.github/actions/valhalla-auth@main
        id: auth
        with:
          harbor: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute version
        id: version
        uses: peavers/.github/actions/compute-version@main

      # Where this actually pushes. The caller names its image with a registry
      # host - docker.valhalla.life/peavers/x - and that host only takes a
      # >100 MB layer over the LAN. valhalla-auth reports where the registry is
      # reachable from *this* runner, so the host is replaced and the repository
      # path kept. Harbor stores by path, so the cluster pulls the same image
      # either way.
      - name: Resolve where to push
        id: target
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          REGISTRY: ${{ steps.auth.outputs.registry }}
          DECLARED: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          first="${IMAGE%%/*}"
          # Only re-host an image that names THIS workflow's registry. A caller
          # pushing somewhere else entirely - ghcr.io, a public registry - must
          # come out unchanged, or it would be silently redirected into Harbor.
          if [ "$first" = "$DECLARED" ]; then
            path="${IMAGE#*/}"
          else
            echo "image=${IMAGE}"    >> "$GITHUB_OUTPUT"
            echo "insecure=false"    >> "$GITHUB_OUTPUT"
            echo "not $DECLARED - leaving ${IMAGE} alone"
            exit 0
          fi
          echo "image=${REGISTRY}/${path}" >> "$GITHUB_OUTPUT"
          # A loopback target is the tunnel listener, which speaks plain HTTP.
          # Docker trusts 127.0.0.1 without being told; jib does not.
          case "$REGISTRY" in
            127.0.0.1:*|localhost:*) echo "insecure=true"  >> "$GITHUB_OUTPUT" ;;
            *)                       echo "insecure=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "pushing to ${REGISTRY}/${path}"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file != '' && inputs.file || format('{0}/Dockerfile', inputs.context) }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ steps.target.outputs.image }}:latest
            ${{ steps.target.outputs.image }}:${{ steps.version.outputs.version }}

      # Buildx could have been handed both registries' tags and pushed once,
      # which is what docker-build-push does. It is a copy here only so that
      # this workflow and the jib one behave identically for a caller — same
      # input, same guarantee, one place to change when Harbor goes.
      - name: Mirror to ECR
        if: inputs.ecr
        uses: peavers/.github/actions/mirror-to-ecr@main
        with:
          image: ${{ steps.target.outputs.image }}
          tags: latest,${{ steps.version.outputs.version }}
