name: Gradle Jib Publish (reusable)

# Build a Spring Boot service with the Jib Gradle plugin and push it to Harbor.
# Harbor creds come from in-cluster Vault (no stored secrets), so this MUST run
# on the self-hosted in-cluster runners. Exposes the computed version/tags as
# outputs so a downstream deploy job can pin the exact image.
#
# Example caller:
#   permissions: { id-token: write, contents: read }
#   jobs:
#     server:
#       uses: peavers/.github/.github/workflows/gradle-jib-publish.yml@main
#       with:
#         working-directory: resonance-server
#         image: docker.valhalla.life/peavers/resonance-server
#         runner: peavers-code-runners

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Gradle build (with the Jib plugin).
        required: true
        type: string
      image:
        description: Full image reference to push (registry/repo, no tag).
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: "25"
      java-distribution:
        required: false
        type: string
        default: temurin
      runner:
        required: false
        type: string
        default: warcraft-runners
      registry:
        description: Container registry host (for docker login).
        required: false
        type: string
        default: docker.valhalla.life
      nexus-npm-auth:
        description: >-
          Set when the Gradle build runs npm against packages.valhalla.life
          (e.g. an embedded web UI resolving @peavers/*). Writes the shared
          Nexus npm _auth from Vault into ~/.npmrc before building.
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: Immutable version pushed (semver from tag, else 7-char SHA).
        value: ${{ jobs.build.outputs.version }}
      tags:
        description: Comma-separated tag list "latest,<version>".
        value: ${{ jobs.build.outputs.tags }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # RUNNER_LABEL is read from the CALLING repository - GitHub resolves the vars
    # context of a reusable workflow against the caller, not against this repo -
    # so one variable per repo moves that repo's jobs off the cluster without a
    # commit anywhere. Unset falls through to `runner`, which is today's
    # behaviour. A caller with a job that must stay in-cluster pins a literal in
    # its own workflow rather than setting the variable.
    runs-on: ${{ vars.RUNNER_LABEL || inputs.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      # Harbor credentials and the route to Harbor. In-cluster that is the
      # registry directly; anywhere else this opens the CI tunnel.
      - uses: peavers/.github/actions/valhalla-auth@main
        id: auth
        with:
          harbor: true

      - name: Fetch Nexus npm auth from Vault
        if: ${{ inputs.nexus-npm-auth }}
        uses: hashicorp/vault-action@v3
        with:
          # The tunnel hostname rather than the cluster service, so a caller that
          # has moved its runner still reaches Vault. Cloudflare terminates a real
          # certificate here, which is why verification is on - the cluster
          # service serves a private CA and needed it skipped.
          url: https://vault-ci.valhalla.life
          method: jwt
          path: jwt-github
          role: ci
          jwtGithubAudience: https://vault.internal
          exportToken: false
          secrets: |
            kv/data/cluster/_shared/nexus-npm auth | NEXUS_NPM_AUTH

      - name: Configure private npm registry
        if: ${{ inputs.nexus-npm-auth }}
        run: |
          cat >> ~/.npmrc <<NPMRC
          //packages.valhalla.life/repository/npm-group/:_auth=${NEXUS_NPM_AUTH}
          //packages.valhalla.life/repository/npm-hosted/:_auth=${NEXUS_NPM_AUTH}
          NPMRC

      - name: Compute version
        id: version
        uses: peavers/.github/actions/compute-version@main

      - name: Build & push image (Jib)
        working-directory: ${{ inputs.working-directory }}
        run: |
      # Where this actually pushes. The caller names its image with a registry
      # host - docker.valhalla.life/peavers/x - and that host only takes a
      # >100 MB layer over the LAN. valhalla-auth reports where the registry is
      # reachable from *this* runner, so the host is replaced and the repository
      # path kept. Harbor stores by path, so the cluster pulls the same image
      # either way.
      - name: Resolve where to push
        id: target
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          REGISTRY: ${{ steps.auth.outputs.registry }}
          DECLARED: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          first="${IMAGE%%/*}"
          # Only re-host an image that names THIS workflow's registry. A caller
          # pushing somewhere else entirely - ghcr.io, a public registry - must
          # come out unchanged, or it would be silently redirected into Harbor.
          if [ "$first" = "$DECLARED" ]; then
            path="${IMAGE#*/}"
          else
            echo "image=${IMAGE}"    >> "$GITHUB_OUTPUT"
            echo "insecure=false"    >> "$GITHUB_OUTPUT"
            echo "not $DECLARED - leaving ${IMAGE} alone"
            exit 0
          fi
          echo "image=${REGISTRY}/${path}" >> "$GITHUB_OUTPUT"
          # A loopback target is the tunnel listener, which speaks plain HTTP.
          # Docker trusts 127.0.0.1 without being told; jib does not.
          case "$REGISTRY" in
            127.0.0.1:*|localhost:*) echo "insecure=true"  >> "$GITHUB_OUTPUT" ;;
            *)                       echo "insecure=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "pushing to ${REGISTRY}/${path}"

          ./gradlew jib \
            -Djib.to.image=${{ steps.target.outputs.image }} \
            -Djib.allowInsecureRegistries=${{ steps.target.outputs.insecure }} \
            -Djib.to.tags=${{ steps.version.outputs.tags }}
